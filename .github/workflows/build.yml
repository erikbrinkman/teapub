name: build

on:
  push:
  pull_request:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun test
      - run: bun export

      # Verify the published package shape (manifest + ESM type resolution)
      - run: bunx publint --strict
      - run: bunx --bun @arethetypeswrong/cli --pack --profile esm-only

  automerge:
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # dependabot-triggered runs get a read-only token unless a job asks for more
    permissions:
      contents: write
      pull-requests: write

    steps:
      - run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
